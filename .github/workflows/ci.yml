name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Gates every supported interpreter on: the full dependency tree resolves and
# installs (the real Python-version risk — C-extension wheels like uvloop /
# numpy / pydantic-core), and the pytest suite passes. The suite's
# import-everything guard (tests/test_imports.py) imports every module under
# src/, api/, AND scripts/, so a broken/stale import anywhere fails here.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (project + test deps)
        run: uv sync --no-dev --group test

      - name: Pytest
        run: uv run --no-sync pytest -q

  # Frontend: install from the lockfile and run the production build, which is
  # `tsc -b` (typecheck — would catch the missing vite-env.d.ts fixed in #3) +
  # `vite build`. Kept separate from the Python matrix so a break in either
  # surface is isolated.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Build (tsc typecheck + vite build)
        run: npm run build
