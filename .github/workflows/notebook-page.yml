name: Notebook page

# Runs the notebooks and publishes them, with every output, as results pages:
#   https://ecoop.github.io/rulebook/embeddings_and_eval.html  (key-free)
#   https://ecoop.github.io/rulebook/walkthrough.html          (needs a key)
# The notebooks stay committed without outputs (so Colab and Jupyter open them
# un-run); these pages are the "read it with results" view. They're built here
# and deployed straight to Pages, never committed.
#
# The walkthrough asks Claude three questions (about a cent each), so it needs
# the ANTHROPIC_API_KEY repo secret. Without the secret, the walkthrough page is
# skipped and only the eval page is published.
#
# Runs only on pushes to main that touch something the notebooks use, plus a
# manual "Run workflow" button. A failed run leaves the last good pages up.
on:
  push:
    branches: [main]
    paths:
      - notebooks/embeddings_and_eval.ipynb
      - notebooks/walkthrough.ipynb
      - notebooks/page_template/**
      - src/rulebook/notebook.py
      - eval/gold/**
      - rules/checkers/**
      - rules/cornhole/**
      - rules/poker/**
      - scripts/build_index.py
      - src/rulebook/app_state.py
      - src/rulebook/chunking.py
      - src/rulebook/config.py
      - src/rulebook/embeddings.py
      - src/rulebook/eval.py
      - src/rulebook/generate.py
      - src/rulebook/ingest.py
      - src/rulebook/pipeline.py
      - src/rulebook/registry.py
      - src/rulebook/retrieve.py
      - src/rulebook/store.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/notebook-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: notebook-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true/false only; the key itself is given to the walkthrough step alone.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      # Same rendering for both pages: the page_template layout, no In/Out
      # prompts, and the "hide-on-results-page" cell (how-to-use box) dropped.
      RENDER: >-
        --execute --to html
        --TemplateExporter.extra_template_basedirs=notebooks
        --template page_template --no-prompt
        --ExecutePreprocessor.timeout=600
        --TagRemovePreprocessor.enabled=True
        --TagRemovePreprocessor.remove_cell_tags=hide-on-results-page
        --output-dir _site
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install (project + notebook deps)
        run: uv sync --group dev

      # The local embedding models (a few tens of MB) come from Hugging Face;
      # cache them so each run doesn't download them again.
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('notebooks/*.ipynb', 'src/rulebook/config.py') }}
          restore-keys: hf-

      # No API key is set here, so this proves the eval notebook is key-free.
      - name: Eval notebook page
        run: uv run --no-sync jupyter nbconvert notebooks/embeddings_and_eval.ipynb $RENDER --output embeddings_and_eval

      - name: Walkthrough page
        if: env.HAS_ANTHROPIC_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --no-sync python scripts/build_index.py --domain cornhole
          uv run --no-sync jupyter nbconvert notebooks/walkthrough.ipynb $RENDER --output walkthrough

      - name: Landing page
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Rulebook notebooks</title>'
            echo '<style>body{font:16px/1.6 system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px}li{margin:.8em 0}</style>'
            echo '<h1>Rulebook notebooks</h1>'
            echo '<p>Notebooks from <a href="https://github.com/ecoop/rulebook">ecoop/rulebook</a>, shown after a fresh run.</p><ul>'
            if [ -f _site/walkthrough.html ]; then
              echo '<li><a href="walkthrough.html"><b>RAG walkthrough: start here</b></a>. A short tour of the whole pipeline, from chunking to Claude'"'"'s cited answer.</li>'
            fi
            echo '<li><a href="embeddings_and_eval.html"><b>Deep dive 1: Embeddings &amp; evaluation</b></a>. What an embedding is, and how to measure retrieval.</li>'
            echo '</ul>'
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
