name: Notebook page

# Runs the notebooks and publishes them, with every output, as results pages:
#   https://ecoop.github.io/rulebook/<notebook>.html, plus the landing page
# The notebooks stay committed without outputs (so Colab and Jupyter open them
# un-run); these pages are the "read it with results" view. They're built here
# and deployed straight to Pages, never committed.
#
# Every notebook is key-free. RAG at a glance shows Claude's answers saved in
# notebooks/data/ (re-recorded by scripts/record_glance_answers.py) rather than
# calling Claude, so no API key is used here.
#
# Runs only on pushes to main that touch something the notebooks use, plus a
# manual "Run workflow" button. A failed run leaves the last good pages up.
on:
  push:
    branches: [main]
    paths:
      - notebooks/rag_at_a_glance.ipynb
      - notebooks/embeddings.ipynb
      - notebooks/evaluation.ipynb
      - notebooks/reranking.ipynb
      - notebooks/chunking.ipynb
      - notebooks/page_template/**
      - notebooks/data/**
      - src/rulebook/notebook.py
      - eval/gold/**
      - rules/checkers/**
      - rules/tennis/**
      - rules/poker/**
      - scripts/build_index.py
      - src/rulebook/app_state.py
      - src/rulebook/chunk_eval.py
      - src/rulebook/chunking.py
      - src/rulebook/config.py
      - src/rulebook/embeddings.py
      - src/rulebook/eval.py
      - src/rulebook/generate.py
      - src/rulebook/ingest.py
      - src/rulebook/pipeline.py
      - src/rulebook/rerank.py
      - src/rulebook/registry.py
      - src/rulebook/retrieve.py
      - src/rulebook/store.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/notebook-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: notebook-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # fastembed keeps its models in a temp dir by default; put them in the cache below.
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      # Same rendering for every page: the page_template layout, no In/Out prompts.
      # The template leaves off cells tagged run-only or run-setup (see index.html.j2).
      RENDER: >-
        --execute --to html
        --TemplateExporter.extra_template_basedirs=notebooks
        --template page_template --no-prompt
        --ExecutePreprocessor.timeout=600
        --output-dir _site
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      # rerank-local adds the cross-encoder (fastembed/ONNX) Reranking uses.
      - name: Install (project + notebook deps)
        run: uv sync --group dev --extra rerank-local

      # The local embedding models (a few tens of MB) and the cross-encoder (~80 MB)
      # come from Hugging Face; cache them so each run doesn't download them again.
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fastembed
          key: hf-${{ hashFiles('notebooks/*.ipynb', 'src/rulebook/config.py') }}
          restore-keys: hf-

      # No API key is set in any step, so these builds prove every notebook is key-free.
      - name: Embeddings page
        run: uv run --no-sync jupyter nbconvert notebooks/embeddings.ipynb $RENDER --output embeddings

      - name: Evaluation page
        run: uv run --no-sync jupyter nbconvert notebooks/evaluation.ipynb $RENDER --output evaluation

      - name: Reranking page
        run: uv run --no-sync jupyter nbconvert notebooks/reranking.ipynb $RENDER --output reranking

      - name: Chunking page
        run: uv run --no-sync jupyter nbconvert notebooks/chunking.ipynb $RENDER --output chunking

      - name: RAG at a glance page
        run: |
          uv run --no-sync python scripts/build_index.py --domain tennis
          uv run --no-sync jupyter nbconvert notebooks/rag_at_a_glance.ipynb $RENDER --output rag_at_a_glance

      # The landing page is a static template, with its vignettes in img/
      # (drawn by notebooks/page_template/vignettes.py).
      - name: Landing page
        run: |
          cp notebooks/page_template/landing.html _site/index.html
          cp -r notebooks/page_template/img _site/img

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Only main publishes. A manual run on another branch (to test a PR before
  # merging) builds the pages and stops here, instead of failing at the deploy.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
