[project]
name = "rulebook"
version = "0.1.0"
description = "RAG prototype for disc sports rules — ultimate and goaltimate — with a FastAPI + React frontend. Built as an instructional example of retrieval-augmented generation over structured documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Generation: Claude via Anthropic's official SDK.
    "anthropic>=0.40.0",

    # Embeddings — one of these two is used at a time; both are installed so
    # you can swap providers via the EMBEDDING_PROVIDER env var without a
    # dependency change. See src/rulebook/embeddings.py.
    "voyageai>=0.3.0",
    "openai>=1.55.0",

    # Vector store: pure-numpy in-memory. For a corpus this size (~400
    # chunks) a real vector DB is overkill — cosine similarity is a
    # matrix multiplication and top-k is an argsort. Fewer moving parts,
    # zero install pain across platforms, and more transparent than an
    # opaque ANN index. Numpy is listed explicitly so we control the
    # version rather than inheriting whatever voyageai pulls in.
    "numpy>=1.26",

    # PDF text extraction. pypdf is pure-Python — no system-level poppler
    # install required. Layout fidelity is okay-not-great; for these rulebooks
    # it's more than enough once we do our own section-aware chunking.
    "pypdf>=5.0.0",

    # HTTP surface.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Config + schemas.
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # Nice-to-have progress bars during ingest.
    "tqdm>=4.66.0",

    # LLM cost caps, rate limiting, and event logging. Shared library —
    # renamed from llm-guardrails; see docs/integration.md in that repo.
    # [fastapi] extra pulls in the request-scoped IP-rate-limit dependency
    # factory; [gcs] pulls the GCS StateBackend (google-cloud-storage) now
    # that we host on Cloud Run — cost-counter state persists in a bucket.
    # Published to PyPI, so a plain version pin rather than a git URL.
    "llm-cost-governor[fastapi,gcs]>=0.4.1",

    # GCS access for the vector index and (Track B) the invite-token
    # allowlist. index_sync.py pulls the index into a writable path at
    # startup; declared directly because we import google.cloud.storage
    # ourselves rather than leaning on the llm-cost-governor[gcs] transitive.
    "google-cloud-storage>=2.10",

    # Invite-token gate for pre-production demos. Opt-in via
    # RULEBOOK_DEMO_MODE=true; a pure pass-through when off, so local
    # dev is unaffected. Also extracted from pitchcraft.
    "guest-auth>=0.1.1",

    # Append-only JSONL event log (ULID + UTC-ISO + last-row-wins reads).
    # interaction_log.py consumes the free-function API — see
    # docs/integration.md in that repo. Extracted from the duplicated log
    # helpers that pitchcraft and rulebook each carried.
    "jsonl-log>=0.1.1",
]

[dependency-groups]
dev = [
    # For the instructional notebook.
    "jupyter>=1.1.0",
    "ipykernel>=6.30.0",
    # Linter / formatter.
    "ruff>=0.7.0",
]
# Kept separate from dev so CI installs pytest without the heavy notebook
# stack (jupyter/ipykernel). CI runs: uv sync --no-dev --group test.
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulebook"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are fine in comment-heavy teaching code

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
# Only `rulebook` is an installed package; `api/` and `scripts/` are top-level
# app dirs. Put the repo root (for the `api` package) and `scripts/` (loose
# modules) on sys.path so the import-everything guard can reach them.
pythonpath = [".", "scripts"]
